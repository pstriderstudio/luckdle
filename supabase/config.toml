# Supabase CLI configuration for local development (`supabase start`).
# Unlisted settings use the CLI defaults.
project_id = "luckdle"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Players start anonymously on first visit; signing in is optional.
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "per_worker"

# The game service requires a signed-in (possibly anonymous) player.
[functions.game]
verify_jwt = true
